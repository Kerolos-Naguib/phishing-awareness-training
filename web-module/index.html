0633\u062A\u064A\u0629"),clue:"logo"},clues:[{id:"sender",suspicious:!0,title:r("Lookalike sender domain","\u0646\u0637\u0627\u0642 \u0645\u0631\u0633\u0644 \u064A\u0634\u0628\u0647 \u0627\u0644\u062D\u0642\u064A\u0642\u064A"),why:r("The display name says IT Support, but the address ends in nile-logistics-it.invalid. Your organization's real domain is nilelogistics.test. Always read the address, not the name.","\u0627\u0644\u0627\u0633\u0645 \u0627\u0644\u0645\u0639\u0631\u0648\u0636 \u0647\u0648 \u0627\u0644\u062F\u0639\u0645 \u0627\u0644\u0641\u0646\u064A\u060C \u0644\u0643\u0646 \u0627\u0644\u0639\u0646\u0648\u0627\u0646 \u064A\u0646\u062A\u0647\u064A \u0628\u0640 nile-logistics-it.invalid. \u0646\u0637\u0627\u0642 \u0645\u0624\u0633\u0633\u062A\u0643 \u0627\u0644\u062D\u0642\u064A\u0642\u064A \u0647\u0648 nilelogistics.test. \u0627\u0642\u0631\u0623 \u0627\u0644\u0639\u0646\u0648\u0627\u0646 \u062F\u0627\u0626\u0645\u064B\u0627 \u0648\u0644\u064A\u0633 \u0627\u0644\u0627\u0633\u0645 \u0641\u0642\u0637.")},{id:"urgency",suspicious:!0,title:r("Artificial urgency","\u0627\u0633\u062A\u0639\u062C\u0627\u0644 \u0645\u0635\u0637\u0646\u0639"),why:r("A two-hour deadline and the threat of losing access are designed to rush you past checking.","\u0645\u0647\u0644\u0629 \u0627\u0644\u0633\u0627\u0639\u062A\u064A\u0646 \u0648\u0627\u0644\u062A\u0647\u062F\u064A\u062F \u0628\u0641\u0642\u062F\u0627\u0646 \u0627\u0644\u0648\u0635\u0648\u0644 \u0645\u0635\u0645\u0651\u0645\u0627\u0646 \u0644\u062F\u0641\u0639\u0643 \u0625\u0644\u0649 \u0627\u0644\u062A\u0635\u0631\u0641 \u0642\u0628\u0644 \u0627\u0644\u062A\u062D\u0642\u0642.")},{id:"link",suspicious:!0,title:r("Link leads to a sign-in page off your domain","\u0627\u0644\u0631\u0627\u0628\u0637 \u064A\u0642\u0648\u062F \u0625\u0644\u0649 \u0635\u0641\u062D\u0629 \u062F\u062E\u0648\u0644 \u062E\u0627\u0631\u062C \u0646\u0637\u0627\u0642 \u0645\u0624\u0633\u0633\u062A\u0643"),why:r("The button points to nile-logistics-it.invalid, not nilelogistics.test. Typing your password there would hand it to the attacker. Don't click: open the official portal yourself or call IT on a known number.","\u0627\u0644\u0632\u0631 \u064A\u0634\u064A\u0631 \u0625\u0644\u0649 nile-logistics-it.invalid \u0648\u0644\u064A\u0633 nilelogistics.test. \u0625\u062F\u062E\u0627\u0644 \u0643\u0644\u0645\u0629 \u0627\u0644\u0645\u0631\u0648\u0631 \u0647\u0646\u0627\u0643 \u064A\u0633\u0644\u0651\u0645\u0647\u0627 \u0644\u0644\u0645\u0647\u0627\u062C\u0645. \u0644\u0627 \u062A\u0646\u0642\u0631: \u0627\u0641\u062A\u062D \u0627\u0644\u0628\u0648\u0627\u0628\u0629 \u0627\u0644\u0631\u0633\u0645\u064A\u0629 \u0628\u0646\u0641\u0633\u0643 \u0623\u0648 \u0627\u062A\u0635\u0644 \u0628\u0627\u0644\u062F\u0639\u0645 \u0627\u0644\u0641\u0646\u064A \u0639\u0644\u0649 \u0631\u0642\u0645 \u062A\u0639\u0631\u0641\u0647.")},{id:"greeting",suspicious:!0,title:r("Generic greeting","\u062A\u062D\u064A\u0629 \u0639\u0627\u0645\u0629"),why:r("Real internal notices usually use your name. A generic greeting suggests a message sent to many people. It is a weak sign on its own, but it adds up.","\u0627\u0644\u0631\u0633\u0627\u0626\u0644 \u0627\u0644\u062F\u0627\u062E\u0644\u064A\u0629 \u0627\u0644\u062D\u0642\u064A\u0642\u064A\u0629 \u062A\u0633\u062A\u062E\u062F\u0645 \u0627\u0633\u0645\u0643 \u0639\u0627\u062F\u0629\u064B. \u0627\u0644\u062A\u062D\u064A\u0629 \u0627\u0644\u0639\u0627\u0645\u0629 \u062A\u0634\u064A\u0631 \u0625\u0644\u0649 \u0631\u0633\u0627\u0644\u0629 \u0623\u064F\u0631\u0633\u0644\u062A \u0644\u0639\u062F\u062F \u0643\u0628\u064A\u0631 \u0645\u0646 \u0627\u0644\u0646\u0627\u0633. \u0647\u064A \u0639\u0644\u0627\u0645\u0629 \u0636\u0639\u064A\u0641\u0629 \u0648\u062D\u062F\u0647\u0627 \u0644\u0643\u0646\u0647\u0627 \u062A\u062A\u0631\u0627\u0643\u0645 \u0645\u0639 \u063A\u064A\u0631\u0647\u0627.")},{id:"logo",suspicious:!1,title:r("Company name in the signature","\u0627\u0633\u0645 \u0627\u0644\u0634\u0631\u0643\u0629 \u0641\u064A \u0627\u0644\u062A\u0648\u0642\u064A\u0639"),why:r("Not a warning sign by itself. Names and logos are easy to copy, so a professional look proves nothing either way.","\u0644\u064A\u0633\u062A \u0639\u0644\u0627\u0645\u0629 \u062A\u062D\u0630\u064A\u0631 \u0628\u062D\u062F \u0630\u0627\u062A\u0647\u0627. \u0627\u0644\u0623\u0633\u0645\u0627\u0621 \u0648\u0627\u0644\u0634\u0639\u0627\u0631\u0627\u062A \u0633\u0647\u0644\u0629 \u0627\u0644\u0646\u0633\u062E\u060C \u0644\u0630\u0644\u0643 \u0627\u0644\u0645\u0638\u0647\u0631 \u0627\u0644\u0645\u0647\u0646\u064A \u0644\u0627 \u064A\u062B\u0628\u062A \u0634\u064A\u0626\u064B\u0627 \u0641\u064A \u0623\u064A \u0627\u062A\u062C\u0627\u0647.")},{id:"date",suspicious:!1,title:r("Date and time","\u0627\u0644\u062A\u0627\u0631\u064A\u062E \u0648\u0627\u0644\u0648\u0642\u062A"),why:r("Normal. Timing alone doesn't tell you whether a message is genuine.","\u0637\u0628\u064A\u0639\u064A. \u0627\u0644\u062A\u0648\u0642\u064A\u062A \u0648\u062D\u062F\u0647 \u0644\u0627 \u064A\u062E\u0628\u0631\u0643 \u0625\u0646 \u0643\u0627\u0646\u062A \u0627\u0644\u0631\u0633\u0627\u0644\u0629 \u062D\u0642\u064A\u0642\u064A\u0629.")}]},{id:"vendor",title:r("Vendor bank change","\u062A\u063A\u064A\u064A\u0631 \u0627\u0644\u062D\u0633\u0627\u0628 \u0627\u0644\u0628\u0646\u0643\u064A \u0644\u0645\u0648\u0631\u0651\u062F"),brief:r("An invoice email that asks you to pay a new account.","\u0631\u0633\u0627\u0644\u0629 \u0641\u0627\u062A\u0648\u0631\u0629 \u062A\u0637\u0644\u0628 \u0627\u0644\u062F\u0641\u0639 \u0625\u0644\u0649 \u062D\u0633\u0627\u0628 \u062C\u062F\u064A\u062F."),from:{name:r("Atlas Components \u2013 Accounts","\u0623\u0637\u0644\u0633 \u0644\u0644\u0645\u0643\u0648\u0651\u0646\u0627\u062A \u2013 \u0627\u0644\u062D\u0633\u0627\u0628\u0627\u062A"),addr:"accounts@atlas-components-billing.invalid",clue:"sender"},to:"you@nilelogistics.test",cc:{name:"Hana Mostafa",addr:"hana.mostafa@nilelogistics.test"},subject:{t:r("Updated bank details for invoice 4471","\u0628\u064A\u0627\u0646\u0627\u062A \u0628\u0646\u0643\u064A\u0629 \u0645\u062D\u062F\u0651\u062B\u0629 \u0644\u0644\u0641\u0627\u062A\u0648\u0631\u0629 4471"),clue:"subject"},date:{t:r("Wed 16:42","\u0627\u0644\u0623\u0631\u0628\u0639\u0627\u0621 16:42"),clue:"date"},body:[[{t:r("Hello,","\u0645\u0631\u062D\u0628\u064B\u0627\u060C")}],[{t:r("Our bank account has changed. ","\u062A\u063A\u064A\u0651\u0631 \u062D\u0633\u0627\u0628\u0646\u0627 \u0627\u0644\u0628\u0646\u0643\u064A. "),clue:"change"},{t:r("Please pay invoice 4471 to the new account listed in the attachment ","\u064A\u0631\u062C\u0649 \u062F\u0641\u0639 \u0627\u0644\u0641\u0627\u062A\u0648\u0631\u0629 4471 \u0625\u0644\u0649 \u0627\u0644\u062D\u0633\u0627\u0628 \u0627\u0644\u062C\u062F\u064A\u062F \u0627\u0644\u0645\u0630\u0643\u0648\u0631 \u0641\u064A \u0627\u0644\u0645\u0631\u0641\u0642 "),clue:"invoice"},{t:r("today, before the end of business.","\u0627\u0644\u064A\u0648\u0645 \u0642\u0628\u0644 \u0646\u0647\u0627\u064A\u0629 \u0627\u0644\u062F\u0648\u0627\u0645."),clue:"rush"}],[{t:r("Our phone lines are being migrated, so please do not call. Reply by email to confirm.","\u062E\u0637\u0648\u0637 \u0627\u0644\u0647\u0627\u062A\u0641 \u0644\u062F\u064A\u0646\u0627 \u0642\u064A\u062F \u0627\u0644\u0646\u0642\u0644\u060C \u0644\u0630\u0627 \u064A\u0631\u062C\u0649 \u0639\u062F\u0645 \u0627\u0644\u0627\u062A\u0635\u0627\u0644. \u0623\u0643\u0651\u062F \u0628\u0627\u0644\u0631\u062F \u0639\u0644\u0649 \u0647\u0630\u0627 \u0627\u0644\u0628\u0631\u064A\u062F."),clue:"nocall"}]],attachment:{name:"Invoice_4471_new_bank.pdf",clue:"attachment"},signature:{t:r("Atlas Components \u2013 Accounts Receivable","\u0623\u0637\u0644\u0633 \u0644\u0644\u0645\u0643\u0648\u0651\u0646\u0627\u062A \u2013 \u0627\u0644\u0630\u0645\u0645 \u0627\u0644\u0645\u062F\u064A\u0646\u0629"),clue:"sig"},clues:[{id:"sender",suspicious:!0,title:r("Lookalike vendor domain","\u0646\u0637\u0627\u0642 \u0645\u0648\u0631\u0651\u062F \u0645\u0634\u0627\u0628\u0647"),why:r(`Your vendor's known domain is atlas-components.test. This one adds "-billing" and ends in .invalid. Compare it with the address already in your vendor records.`,'\u0646\u0637\u0627\u0642 \u0645\u0648\u0631\u0651\u062F\u0643 \u0627\u0644\u0645\u0639\u0631\u0648\u0641 \u0647\u0648 atlas-components.test. \u0647\u0630\u0627 \u0627\u0644\u0646\u0637\u0627\u0642 \u064A\u0636\u064A\u0641 "-billing" \u0648\u064A\u0646\u062A\u0647\u064A \u0628\u0640 .invalid. \u0642\u0627\u0631\u0646\u0647 \u0628\u0627\u0644\u0639\u0646\u0648\u0627\u0646 \u0627\u0644\u0645\u0633\u062C\u0651\u0644 \u0641\u064A \u0633\u062C\u0644\u0627\u062A \u0627\u0644\u0645\u0648\u0631\u062F\u064A\u0646 \u0644\u062F\u064A\u0643.')},{id:"change",suspicious:!0,title:r("Request to change payment details","\u0637\u0644\u0628 \u062A\u063A\u064A\u064A\u0631 \u0628\u064A\u0627\u0646\u0627\u062A \u0627\u0644\u062F\u0641\u0639"),why:r("Changing bank details is a classic business email compromise move. Any change must be confirmed through a contact you already have on file.","\u062A\u063A\u064A\u064A\u0631 \u0627\u0644\u0628\u064A\u0627\u0646\u0627\u062A \u0627\u0644\u0628\u0646\u0643\u064A\u0629 \u062D\u064A\u0644\u0629 \u0643\u0644\u0627\u0633\u064A\u0643\u064A\u0629 \u0641\u064A \u0627\u062E\u062A\u0631\u0627\u0642 \u0627\u0644\u0628\u0631\u064A\u062F \u0627\u0644\u062A\u062C\u0627\u0631\u064A. \u0623\u064A \u062A\u063A\u064A\u064A\u0631 \u064A\u062C\u0628 \u062A\u0623\u0643\u064A\u062F\u0647 \u0639\u0628\u0631 \u062C\u0647\u0629 \u0627\u062A\u0635\u0627\u0644 \u0645\u0633\u062C\u0651\u0644\u0629 \u0644\u062F\u064A\u0643 \u0645\u0633\u0628\u0642\u064B\u0627.")},{id:"nocall",suspicious:!0,title:r(`"Don't call" blocks verification`,'\u0639\u0628\u0627\u0631\u0629 "\u0644\u0627 \u062A\u062A\u0635\u0644" \u062A\u0645\u0646\u0639 \u0627\u0644\u062A\u062D\u0642\u0642'),why:r("The one step that would expose the fraud, a phone call to a known number, is discouraged. Treat any instruction to avoid verification as a red flag.","\u0627\u0644\u062E\u0637\u0648\u0629 \u0627\u0644\u0648\u062D\u064A\u062F\u0629 \u0627\u0644\u062A\u064A \u0642\u062F \u062A\u0643\u0634\u0641 \u0627\u0644\u0627\u062D\u062A\u064A\u0627\u0644\u060C \u0648\u0647\u064A \u0627\u0644\u0627\u062A\u0635\u0627\u0644 \u0628\u0631\u0642\u0645 \u0645\u0639\u0631\u0648\u0641\u060C \u064A\u064F\u0646\u0647\u0649 \u0639\u0646\u0647\u0627. \u0627\u0639\u062A\u0628\u0631 \u0623\u064A \u062A\u0639\u0644\u064A\u0645\u0627\u062A \u0628\u062A\u062C\u0646\u0651\u0628 \u0627\u0644\u062A\u062D\u0642\u0642 \u0639\u0644\u0627\u0645\u0629 \u062A\u062D\u0630\u064A\u0631.")},{id:"rush",suspicious:!0,title:r("Same-day payment pressure","\u0636\u063A\u0637 \u0644\u0644\u062F\u0641\u0639 \u0641\u064A \u0627\u0644\u064A\u0648\u0645 \u0646\u0641\u0633\u0647"),why:r("A same-day deadline leaves no time for normal approval and checks. That pressure is the point.","\u0627\u0644\u0645\u0647\u0644\u0629 \u0641\u064A \u0627\u0644\u064A\u0648\u0645 \u0646\u0641\u0633\u0647 \u0644\u0627 \u062A\u062A\u0631\u0643 \u0648\u0642\u062A\u064B\u0627 \u0644\u0644\u0645\u0648\u0627\u0641\u0642\u0627\u062A \u0648\u0627\u0644\u0641\u062D\u0648\u0635 \u0627\u0644\u0645\u0639\u062A\u0627\u062F\u0629. \u0647\u0630\u0627 \u0627\u0644\u0636\u063A\u0637 \u0647\u0648 \u0627\u0644\u0647\u062F\u0641.")},{id:"attachment",suspicious:!1,title:r("PDF attachment","\u0645\u0631\u0641\u0642 PDF"),why:r("A PDF is a normal invoice format, so the file type is not the problem here. The request inside it is. Never use bank details from an unverified message.","\u0645\u0644\u0641 PDF \u0635\u064A\u063A\u0629 \u0637\u0628\u064A\u0639\u064A\u0629 \u0644\u0644\u0641\u0648\u0627\u062A\u064A\u0631\u060C \u0644\u0630\u0627 \u0646\u0648\u0639 \u0627\u0644\u0645\u0644\u0641 \u0644\u064A\u0633 \u0627\u0644\u0645\u0634\u0643\u0644\u0629 \u0647\u0646\u0627. \u0627\u0644\u0645\u0634\u0643\u0644\u0629 \u0641\u064A \u0627\u0644\u0637\u0644\u0628 \u0627\u0644\u0630\u064A \u0628\u062F\u0627\u062E\u0644\u0647. \u0644\u0627 \u062A\u0639\u062A\u0645\u062F \u0628\u064A\u0627\u0646\u0627\u062A \u0628\u0646\u0643\u064A\u0629 \u0645\u0646 \u0631\u0633\u0627\u0644\u0629 \u0644\u0645 \u062A\u062A\u062D\u0642\u0642 \u0645\u0646\u0647\u0627.")},{id:"invoice",suspicious:!1,title:r("Invoice number","\u0631\u0642\u0645 \u0627\u0644\u0641\u0627\u062A\u0648\u0631\u0629"),why:r("A real-looking number is easy to include. It does not prove the message is genuine.","\u0645\u0646 \u0627\u0644\u0633\u0647\u0644 \u0625\u062F\u0631\u0627\u062C \u0631\u0642\u0645 \u064A\u0628\u062F\u0648 \u062D\u0642\u064A\u0642\u064A\u064B\u0627. \u0647\u0630\u0627 \u0644\u0627 \u064A\u062B\u0628\u062A \u0623\u0646 \u0627\u0644\u0631\u0633\u0627\u0644\u0629 \u0623\u0635\u0644\u064A\u0629.")},{id:"subject",suspicious:!1,title:r("Subject line","\u0633\u0637\u0631 \u0627\u0644\u0645\u0648\u0636\u0648\u0639"),why:r("Plain and businesslike. The warning signs are in the sender and the request.","\u0628\u0633\u064A\u0637 \u0648\u0645\u0647\u0646\u064A. \u0639\u0644\u0627\u0645\u0627\u062A \u0627\u0644\u062A\u062D\u0630\u064A\u0631 \u0641\u064A \u0627\u0644\u0645\u0631\u0633\u0644 \u0648\u0641\u064A \u0627\u0644\u0637\u0644\u0628.")},{id:"date",suspicious:!1,title:r("Date and time","\u0627\u0644\u062A\u0627\u0631\u064A\u062E \u0648\u0627\u0644\u0648\u0642\u062A"),why:r("Normal. Timing alone proves nothing.","\u0637\u0628\u064A\u0639\u064A. \u0627\u0644\u062A\u0648\u0642\u064A\u062A \u0648\u062D\u062F\u0647 \u0644\u0627 \u064A\u062B\u0628\u062A \u0634\u064A\u0626\u064B\u0627.")},{id:"sig",suspicious:!1,title:r("Signature block","\u0627\u0644\u062A\u0648\u0642\u064A\u0639"),why:r("Signatures are easy to copy from real emails, so they are weak evidence.","\u0627\u0644\u062A\u0648\u0627\u0642\u064A\u0639 \u0633\u0647\u0644\u0629 \u0627\u0644\u0646\u0633\u062E \u0645\u0646 \u0631\u0633\u0627\u0626\u0644 \u062D\u0642\u064A\u0642\u064A\u0629\u060C \u0644\u0630\u0644\u0643 \u0647\u064A \u062F\u0644\u064A\u0644 \u0636\u0639\u064A\u0641.")}]},{id:"payroll",title:r("Payroll statement","\u0643\u0634\u0641 \u0627\u0644\u0631\u0627\u062A\u0628"),brief:r("An HR message with an attachment to open.","\u0631\u0633\u0627\u0644\u0629 \u0645\u0648\u0627\u0631\u062F \u0628\u0634\u0631\u064A\u0629 \u0628\u0645\u0631\u0641\u0642 \u064A\u064F\u0637\u0644\u0628 \u0641\u062A\u062D\u0647."),from:{name:r("HR Payroll","\u0627\u0644\u0631\u0648\u0627\u062A\u0628 \u2013 \u0627\u0644\u0645\u0648\u0627\u0631\u062F \u0627\u0644\u0628\u0634\u0631\u064A\u0629"),addr:"hr-payroll@nile-logistics-hr.invalid",clue:"sender"},to:"you@nilelogistics.test",subject:{t:r("Your salary statement has changed","\u062A\u0645 \u062A\u063A\u064A\u064A\u0631 \u0643\u0634\u0641 \u0631\u0627\u062A\u0628\u0643"),clue:"subject"},date:{t:r("Thu 08:05","\u0627\u0644\u062E\u0645\u064A\u0633 08:05"),clue:"date"},body:[[{t:r("Hi,","\u0645\u0631\u062D\u0628\u064B\u0627\u060C")}],[{t:r("Your salary statement for this month was updated. Open the attached file and ","\u062A\u0645 \u062A\u062D\u062F\u064A\u062B \u0643\u0634\u0641 \u0631\u0627\u062A\u0628\u0643 \u0644\u0647\u0630\u0627 \u0627\u0644\u0634\u0647\u0631. \u0627\u0641\u062A\u062D \u0627\u0644\u0645\u0644\u0641 \u0627\u0644\u0645\u0631\u0641\u0642 \u0648")},{t:r('click "Enable content" to view it.','\u0627\u0646\u0642\u0631 \u0639\u0644\u0649 "\u062A\u0645\u0643\u064A\u0646 \u0627\u0644\u0645\u062D\u062A\u0648\u0649" \u0644\u0639\u0631\u0636\u0647.'),clue:"enable"}],[{t:r("Please review it before Friday.","\u064A\u0631\u062C\u0649 \u0645\u0631\u0627\u062C\u0639\u062A\u0647 \u0642\u0628\u0644 \u064A\u0648\u0645 \u0627\u0644\u062C\u0645\u0639\u0629."),clue:"deadline"}]],attachment:{name:"Salary_Statement.pdf.exe",clue:"attachment"},signature:{t:r("Human Resources","\u0627\u0644\u0645\u0648\u0627\u0631\u062F \u0627\u0644\u0628\u0634\u0631\u064A\u0629"),clue:"sig"},clues:[{id:"sender",suspicious:!0,title:r("Sender domain is not your company's","\u0646\u0637\u0627\u0642 \u0627\u0644\u0645\u0631\u0633\u0644 \u0644\u064A\u0633 \u0646\u0637\u0627\u0642 \u0634\u0631\u0643\u062A\u0643"),why:r("HR would write from nilelogistics.test. This address uses nile-logistics-hr.invalid.","\u0642\u0633\u0645 \u0627\u0644\u0645\u0648\u0627\u0631\u062F \u0627\u0644\u0628\u0634\u0631\u064A\u0629 \u064A\u0631\u0627\u0633\u0644\u0643 \u0645\u0646 nilelogistics.test. \u0647\u0630\u0627 \u0627\u0644\u0639\u0646\u0648\u0627\u0646 \u064A\u0633\u062A\u062E\u062F\u0645 nile-logistics-hr.invalid.")},{id:"attachment",suspicious:!0,title:r("Double file extension","\u0627\u0645\u062A\u062F\u0627\u062F \u0645\u0644\u0641 \u0645\u0632\u062F\u0648\u062C"),why:r('"Salary_Statement.pdf.exe" pretends to be a PDF but is a program. Attackers add a familiar extension to hide the real one.','\u0627\u0644\u0645\u0644\u0641 "Salary_Statement.pdf.exe" \u064A\u062A\u0638\u0627\u0647\u0631 \u0628\u0623\u0646\u0647 PDF \u0644\u0643\u0646\u0647 \u0628\u0631\u0646\u0627\u0645\u062C. \u064A\u0636\u064A\u0641 \u0627\u0644\u0645\u0647\u0627\u062C\u0645\u0648\u0646 \u0627\u0645\u062A\u062F\u0627\u062F\u064B\u0627 \u0645\u0623\u0644\u0648\u0641\u064B\u0627 \u0644\u0625\u062E\u0641\u0627\u0621 \u0627\u0644\u0627\u0645\u062A\u062F\u0627\u062F \u0627\u0644\u062D\u0642\u064A\u0642\u064A.')},{id:"enable",suspicious:!0,title:r("Asks you to enable content","\u064A\u0637\u0644\u0628 \u0645\u0646\u0643 \u062A\u0645\u0643\u064A\u0646 \u0627\u0644\u0645\u062D\u062A\u0648\u0649"),why:r(`Documents that need you to "enable content" to be readable are a common way to run malware. A normal statement doesn't need it.`,'\u0627\u0644\u0645\u0633\u062A\u0646\u062F\u0627\u062A \u0627\u0644\u062A\u064A \u062A\u062A\u0637\u0644\u0628 "\u062A\u0645\u0643\u064A\u0646 \u0627\u0644\u0645\u062D\u062A\u0648\u0649" \u0644\u062A\u0635\u0628\u062D \u0645\u0642\u0631\u0648\u0621\u0629 \u0637\u0631\u064A\u0642\u0629 \u0634\u0627\u0626\u0639\u0629 \u0644\u062A\u0634\u063A\u064A\u0644 \u0627\u0644\u0628\u0631\u0645\u062C\u064A\u0627\u062A \u0627\u0644\u062E\u0628\u064A\u062B\u0629. \u0627\u0644\u0643\u0634\u0641 \u0627\u0644\u0639\u0627\u062F\u064A \u0644\u0627 \u064A\u062D\u062A\u0627\u062C \u0630\u0644\u0643.')},{id:"deadline",suspicious:!1,title:r("Friday deadline","\u0645\u0647\u0644\u0629 \u062D\u062A\u0649 \u0627\u0644\u062C\u0645\u0639\u0629"),why:r("A deadline alone is not proof. HR does set deadlines, so judge it together with the sender and the attachment.","\u0627\u0644\u0645\u0647\u0644\u0629 \u0648\u062D\u062F\u0647\u0627 \u0644\u064A\u0633\u062A \u062F\u0644\u064A\u0644\u064B\u0627. \u0627\u0644\u0645\u0648\u0627\u0631\u062F \u0627\u0644\u0628\u0634\u0631\u064A\u0629 \u062A\u0636\u0639 \u0645\u0648\u0627\u0639\u064A\u062F \u0623\u062D\u064A\u0627\u0646\u064B\u0627\u060C \u0644\u0630\u0627 \u0642\u064A\u0651\u0645\u0647\u0627 \u0645\u0639 \u0627\u0644\u0645\u0631\u0633\u0644 \u0648\u0627\u0644\u0645\u0631\u0641\u0642.")},{id:"subject",suspicious:!1,title:r("Subject line","\u0633\u0637\u0631 \u0627\u0644\u0645\u0648\u0636\u0648\u0639"),why:r("Curiosity is the bait, but the wording is not a technical warning sign.","\u0627\u0644\u0641\u0636\u0648\u0644 \u0647\u0648 \u0627\u0644\u0637\u064F\u0651\u0639\u0645\u060C \u0644\u0643\u0646 \u0627\u0644\u0635\u064A\u0627\u063A\u0629 \u0644\u064A\u0633\u062A \u0639\u0644\u0627\u0645\u0629 \u062A\u0642\u0646\u064A\u0629 \u0644\u0644\u062A\u062D\u0630\u064A\u0631.")},{id:"date",suspicious:!1,title:r("Date and time","\u0627\u0644\u062A\u0627\u0631\u064A\u062E \u0648\u0627\u0644\u0648\u0642\u062A"),why:r("Normal. Timing alone proves nothing.","\u0637\u0628\u064A\u0639\u064A. \u0627\u0644\u062A\u0648\u0642\u064A\u062A \u0648\u062D\u062F\u0647 \u0644\u0627 \u064A\u062B\u0628\u062A \u0634\u064A\u0626\u064B\u0627.")},{id:"sig",suspicious:!1,title:r("Signature","\u0627\u0644\u062A\u0648\u0642\u064A\u0639"),why:r("Easy to copy. Not evidence either way.","\u0633\u0647\u0644 \u0627\u0644\u0646\u0633\u062E. \u0644\u064A\u0633 \u062F\u0644\u064A\u0644\u064B\u0627 \u0641\u064A \u0623\u064A \u0627\u062A\u062C\u0627\u0647.")}]}];var as="deltatrust.test",Qt=[{id:"subdomain",context:r('A text says: "Delta Trust: new sign-in detected. Review it here."','\u0631\u0633\u0627\u0644\u0629 \u0646\u0635\u064A\u0629: "\u062F\u0644\u062A\u0627 \u062A\u0631\u0633\u062A: \u062A\u0645 \u0631\u0635\u062F \u062A\u0633\u062C\u064A\u0644 \u062F\u062E\u0648\u0644 \u062C\u062F\u064A\u062F. \u0631\u0627\u062C\u0639\u0647 \u0647\u0646\u0627."'),segments:["https://","deltatrust.test",".account-verify.invalid","/login"],culprit:2,title:r("The real domain is at the end","\u0627\u0644\u0646\u0637\u0627\u0642 \u0627\u0644\u062D\u0642\u064A\u0642\u064A \u0641\u064A \u0646\u0647\u0627\u064A\u0629 \u0627\u0644\u0639\u0646\u0648\u0627\u0646"),explain:r("Read the host from right to left, up to the first single slash. The registered domain here is account-verify.invalid. The familiar deltatrust.test is only a prefix that the attacker placed in front.","\u0627\u0642\u0631\u0623 \u0627\u0633\u0645 \u0627\u0644\u0645\u0636\u064A\u0641 \u0645\u0646 \u0627\u0644\u064A\u0645\u064A\u0646 \u0625\u0644\u0649 \u0627\u0644\u064A\u0633\u0627\u0631 \u062D\u062A\u0649 \u0623\u0648\u0644 \u0634\u0631\u0637\u0629 \u0645\u0627\u0626\u0644\u0629 \u0645\u0646\u0641\u0631\u062F\u0629. \u0627\u0644\u0646\u0637\u0627\u0642 \u0627\u0644\u0645\u0633\u062C\u0651\u0644 \u0647\u0646\u0627 \u0647\u0648 account-verify.invalid. \u0623\u0645\u0627 deltatrust.test \u0627\u0644\u0645\u0623\u0644\u0648\u0641 \u0641\u0647\u0648 \u0645\u062C\u0631\u062F \u0628\u0627\u062F\u0626\u0629 \u0648\u0636\u0639\u0647\u0627 \u0627\u0644\u0645\u0647\u0627\u062C\u0645 \u0641\u064A \u0627\u0644\u0645\u0642\u062F\u0645\u0629.")},{id:"genuine",context:r("You typed the address from your bookmarks to sign in to Delta Trust.","\u0643\u062A\u0628\u062A \u0627\u0644\u0639\u0646\u0648\u0627\u0646 \u0645\u0646 \u0627\u0644\u0625\u0634\u0627\u0631\u0627\u062A \u0627\u0644\u0645\u0631\u062C\u0639\u064A\u0629 \u0644\u062A\u0633\u062C\u064A\u0644 \u0627\u0644\u062F\u062E\u0648\u0644 \u0625\u0644\u0649 \u062F\u0644\u062A\u0627 \u062A\u0631\u0633\u062A."),segments:["https://","deltatrust.test","/login"],culprit:null,title:r("This address matches","\u0647\u0630\u0627 \u0627\u0644\u0639\u0646\u0648\u0627\u0646 \u0645\u0637\u0627\u0628\u0642"),explain:r("The domain is exactly deltatrust.test, the one you already know. Not every address is a trap, and checking is what lets you proceed with confidence.","\u0627\u0644\u0646\u0637\u0627\u0642 \u0647\u0648 deltatrust.test \u062A\u0645\u0627\u0645\u064B\u0627\u060C \u0648\u0647\u0648 \u0627\u0644\u0630\u064A \u062A\u0639\u0631\u0641\u0647 \u0645\u0633\u0628\u0642\u064B\u0627. \u0644\u064A\u0633 \u0643\u0644 \u0639\u0646\u0648\u0627\u0646 \u0641\u062E\u064B\u0651\u0627\u060C \u0648\u0627\u0644\u062A\u062D\u0642\u0642 \u0647\u0648 \u0645\u0627 \u064A\u062A\u064A\u062D \u0644\u0643 \u0627\u0644\u0645\u062A\u0627\u0628\u0639\u0629 \u0628\u062B\u0642\u0629.")},{id:"typo",context:r("An email says your card is locked and gives a link.","\u0631\u0633\u0627\u0644\u0629 \u0628\u0631\u064A\u062F \u062A\u0642\u0648\u0644 \u0625\u0646 \u0628\u0637\u0627\u0642\u062A\u0643 \u0645\u0642\u0641\u0644\u0629 \u0648\u062A\u062A\u0636\u0645\u0646 \u0631\u0627\u0628\u0637\u064B\u0627."),segments:["https://","de1tatrust",".test","/login"],culprit:1,title:r("One character swapped","\u062D\u0631\u0641 \u0648\u0627\u062D\u062F \u0645\u064F\u0633\u062A\u0628\u062F\u064E\u0644"),explain:r('"de1tatrust" uses the digit 1 instead of the letter l. It is a different domain that merely looks the same at a glance. Slow down and read every character.','\u0627\u0644\u0639\u0646\u0648\u0627\u0646 "de1tatrust" \u064A\u0633\u062A\u062E\u062F\u0645 \u0627\u0644\u0631\u0642\u0645 1 \u0628\u062F\u0644 \u062D\u0631\u0641 l. \u0647\u0648 \u0646\u0637\u0627\u0642 \u0645\u062E\u062A\u0644\u0641 \u064A\u0628\u062F\u0648 \u0645\u0637\u0627\u0628\u0642\u064B\u0627 \u0644\u0645\u0646 \u064A\u0645\u0631 \u0639\u0644\u064A\u0647 \u0633\u0631\u064A\u0639\u064B\u0627. \u062A\u0645\u0647\u0651\u0644 \u0648\u0627\u0642\u0631\u0623 \u0643\u0644 \u062D\u0631\u0641.')},{id:"extra-word",context:r('A chat message offers "help" resetting your password.','\u0631\u0633\u0627\u0644\u0629 \u0645\u062D\u0627\u062F\u062B\u0629 \u062A\u0639\u0631\u0636 "\u0645\u0633\u0627\u0639\u062F\u062A\u0643" \u0641\u064A \u0625\u0639\u0627\u062F\u0629 \u062A\u0639\u064A\u064A\u0646 \u0643\u0644\u0645\u0629 \u0627\u0644\u0645\u0631\u0648\u0631.'),segments:["https://","deltatrust-support",".test","/reset-password"],culprit:1,title:r("An extra word makes a new domain","\u0643\u0644\u0645\u0629 \u0625\u0636\u0627\u0641\u064A\u0629 \u062A\u0635\u0646\u0639 \u0646\u0637\u0627\u0642\u064B\u0627 \u062C\u062F\u064A\u062F\u064B\u0627"),explain:r(`The bank's domain is deltatrust.test. Adding "-support" creates a different name that anyone could register. Only the exact known domain counts.`,'\u0646\u0637\u0627\u0642 \u0627\u0644\u0628\u0646\u0643 \u0647\u0648 deltatrust.test. \u0625\u0636\u0627\u0641\u0629 "-support" \u062A\u0635\u0646\u0639 \u0627\u0633\u0645\u064B\u0627 \u0645\u062E\u062A\u0644\u0641\u064B\u0627 \u064A\u0645\u0643\u0646 \u0644\u0623\u064A \u0634\u062E\u0635 \u062A\u0633\u062C\u064A\u0644\u0647. \u0627\u0644\u0645\u0639\u062A\u0645\u062F \u0647\u0648 \u0627\u0644\u0646\u0637\u0627\u0642 \u0627\u0644\u0645\u0639\u0631\u0648\u0641 \u062A\u0645\u0627\u0645\u064B\u0627 \u0641\u0642\u0637.')},{id:"at-sign",context:r("A pop-up on a shopping site says you've won a refund from Delta Trust.","\u0646\u0627\u0641\u0630\u0629 \u0645\u0646\u0628\u062B\u0642\u0629 \u0641\u064A \u0645\u0648\u0642\u0639 \u062A\u0633\u0648\u0642 \u062A\u0642\u0648\u0644 \u0625\u0646\u0643 \u0631\u0628\u062D\u062A \u0627\u0633\u062A\u0631\u062F\u0627\u062F\u064B\u0627 \u0645\u0646 \u062F\u0644\u062A\u0627 \u062A\u0631\u0633\u062A."),segments:["https://","deltatrust.test@","secure-check.invalid","/login"],culprit:2,title:r("Everything before @ is ignored","\u0643\u0644 \u0645\u0627 \u0642\u0628\u0644 @ \u064A\u064F\u062A\u062C\u0627\u0647\u0644"),explain:r("In an address, text before an @ sign is treated as a username, not the destination. The browser would actually go to secure-check.invalid.","\u0641\u064A \u0627\u0644\u0639\u0646\u0648\u0627\u0646\u060C \u064A\u064F\u0639\u0627\u0645\u064E\u0644 \u0627\u0644\u0646\u0635 \u0627\u0644\u0630\u064A \u064A\u0633\u0628\u0642 \u0639\u0644\u0627\u0645\u0629 @ \u0643\u0627\u0633\u0645 \u0645\u0633\u062A\u062E\u062F\u0645 \u0648\u0644\u064A\u0633 \u0648\u062C\u0647\u0629. \u0627\u0644\u0645\u062A\u0635\u0641\u062D \u0633\u064A\u0630\u0647\u0628 \u0641\u0639\u0644\u064A\u064B\u0627 \u0625\u0644\u0649 secure-check.invalid.")}];var he=[{id:"call",title:r("The helpful IT caller",'\u0627\u0644\u0645\u062A\u0635\u0644 "\u0627\u0644\u0645\u0633\u0627\u0639\u062F" \u0645\u0646 \u062A\u0642\u0646\u064A\u0629 \u0627\u0644\u0645\u0639\u0644\u0648\u0645\u0627\u062A'),channel:r("Phone call","\u0645\u0643\u0627\u0644\u0645\u0629 \u0647\u0627\u062A\u0641\u064A\u0629"),beats:[{kind:"call",who:r("Caller","\u0627\u0644\u0645\u062A\u0635\u0644"),say:r("Hi, this is IT security. We've detected a sign-in to your account from another country.","\u0645\u0631\u062D\u0628\u064B\u0627\u060C \u0645\u0639\u0643 \u0623\u0645\u0646 \u0627\u0644\u0645\u0639\u0644\u0648\u0645\u0627\u062A. \u0631\u0635\u062F\u0646\u0627 \u062A\u0633\u062C\u064A\u0644 \u062F\u062E\u0648\u0644 \u0625\u0644\u0649 \u062D\u0633\u0627\u0628\u0643 \u0645\u0646 \u062F\u0648\u0644\u0629 \u0623\u062E\u0631\u0649.")},{kind:"call",who:r("Caller","\u0627\u0644\u0645\u062A\u0635\u0644"),say:r("To block it, I need the 6-digit code we just sent to your phone. Quickly, please, it expires in a minute.","\u0644\u0625\u064A\u0642\u0627\u0641\u0647 \u0623\u062D\u062A\u0627\u062C \u0631\u0645\u0632 \u0627\u0644\u062A\u062D\u0642\u0642 \u0627\u0644\u0645\u0643\u0648\u0651\u0646 \u0645\u0646 6 \u0623\u0631\u0642\u0627\u0645 \u0627\u0644\u0630\u064A \u0623\u0631\u0633\u0644\u0646\u0627\u0647 \u0644\u0647\u0627\u062A\u0641\u0643 \u0627\u0644\u0622\u0646. \u0628\u0633\u0631\u0639\u0629 \u0645\u0646 \u0641\u0636\u0644\u0643\u060C \u064A\u0646\u062A\u0647\u064A \u062E\u0644\u0627\u0644 \u062F\u0642\u064A\u0642\u0629.")},{kind:"sms",who:r("Text message","\u0631\u0633\u0627\u0644\u0629 \u0646\u0635\u064A\u0629"),say:r("Your verification code is 482 915. Never share it.","\u0631\u0645\u0632 \u0627\u0644\u062A\u062D\u0642\u0642 \u0627\u0644\u062E\u0627\u0635 \u0628\u0643 \u0647\u0648 482 915. \u0644\u0627 \u062A\u0634\u0627\u0631\u0643\u0647 \u0645\u0639 \u0623\u062D\u062F.")}],question:r("What do you do?","\u0645\u0627\u0630\u0627 \u062A\u0641\u0639\u0644\u061F"),options:[{text:r("Read the code out loud to stop the attack","\u0623\u0642\u0631\u0623 \u0627\u0644\u0631\u0645\u0632 \u0628\u0635\u0648\u062A \u0639\u0627\u0644\u064D \u0644\u0625\u064A\u0642\u0627\u0641 \u0627\u0644\u0647\u062C\u0648\u0645"),severity:"unsafe",points:0,outcome:r("The code was triggered by the caller's own sign-in attempt. By reading it out, you complete their login. They now have access to your account.","\u0627\u0644\u0631\u0645\u0632 \u0646\u062A\u062C \u0639\u0646 \u0645\u062D\u0627\u0648\u0644\u0629 \u0627\u0644\u062F\u062E\u0648\u0644 \u0627\u0644\u062A\u064A \u0623\u062C\u0631\u0627\u0647\u0627 \u0627\u0644\u0645\u062A\u0635\u0644 \u0646\u0641\u0633\u0647. \u0628\u0642\u0631\u0627\u0621\u062A\u0647 \u062A\u064F\u0643\u0645\u0644 \u0639\u0645\u0644\u064A\u0629 \u062F\u062E\u0648\u0644\u0647\u060C \u0648\u064A\u0635\u0628\u062D \u0644\u062F\u064A\u0647 \u0648\u0635\u0648\u0644 \u0625\u0644\u0649 \u062D\u0633\u0627\u0628\u0643."),lesson:r("A verification code proves it's you. Never read one to anyone, even someone who sounds official.","\u0631\u0645\u0632 \u0627\u0644\u062A\u062D\u0642\u0642 \u064A\u062B\u0628\u062A \u0623\u0646\u0643 \u0623\u0646\u062A. \u0644\u0627 \u062A\u0642\u0631\u0623\u0647 \u0644\u0623\u064A \u0634\u062E\u0635\u060C \u062D\u062A\u0649 \u0644\u0648 \u0628\u062F\u0627 \u0631\u0633\u0645\u064A\u064B\u0627.")},{text:r("Ask the caller to email you proof first","\u0623\u0637\u0644\u0628 \u0645\u0646 \u0627\u0644\u0645\u062A\u0635\u0644 \u0625\u0631\u0633\u0627\u0644 \u0625\u062B\u0628\u0627\u062A \u0628\u0627\u0644\u0628\u0631\u064A\u062F \u0623\u0648\u0644\u064B\u0627"),severity:"partial",points:1,outcome:r("Better, because you didn't share the code. But email proof can be forged, and you are still dealing on the attacker's terms.","\u0623\u0641\u0636\u0644 \u0644\u0623\u0646\u0643 \u0644\u0645 \u062A\u0634\u0627\u0631\u0643 \u0627\u0644\u0631\u0645\u0632. \u0644\u0643\u0646 \u0627\u0644\u0625\u062B\u0628\u0627\u062A \u0639\u0628\u0631 \u0627\u0644\u0628\u0631\u064A\u062F \u064A\u0645\u0643\u0646 \u062A\u0632\u0648\u064A\u0631\u0647\u060C \u0648\u0645\u0627 \u0632\u0644\u062A \u062A\u062A\u0639\u0627\u0645\u0644 \u0628\u0634\u0631\u0648\u0637 \u0627\u0644\u0645\u0647\u0627\u062C\u0645."),lesson:r("Don't verify someone using a channel they control. End the call and use one you trust.","\u0644\u0627 \u062A\u062A\u062D\u0642\u0642 \u0645\u0646 \u0634\u062E\u0635 \u0639\u0628\u0631 \u0642\u0646\u0627\u0629 \u064A\u062A\u062D\u0643\u0645 \u0628\u0647\u0627. \u0623\u0646\u0647\u0650 \u0627\u0644\u0645\u0643\u0627\u0644\u0645\u0629 \u0648\u0627\u0633\u062A\u062E\u062F\u0645 \u0642\u0646\u0627\u0629 \u062A\u062B\u0642 \u0628\u0647\u0627.")},{text:r("Hang up, call IT on the number in the staff directory, and report it","\u0623\u0646\u0647\u064A \u0627\u0644\u0645\u0643\u0627\u0644\u0645\u0629 \u0648\u0623\u062A\u0635\u0644 \u0628\u0627\u0644\u062F\u0639\u0645 \u0627\u0644\u0641\u0646\u064A \u0639\u0644\u0649 \u0627\u0644\u0631\u0642\u0645 \u0627\u0644\u0645\u0648\u062C\u0648\u062F \u0641\u064A \u062F\u0644\u064A\u0644 \u0627\u0644\u0645\u0648\u0638\u0641\u064A\u0646 \u0648\u0623\u0628\u0644\u0651\u063A"),severity:"safe",points:2,outcome:r("IT confirms they didn't call. They lock the targeted sign-in attempt and warn colleagues. You stopped the attack at the first step.","\u064A\u0624\u0643\u062F \u0627\u0644\u062F\u0639\u0645 \u0627\u0644\u0641\u0646\u064A \u0623\u0646\u0647 \u0644\u0645 \u064A\u062A\u0635\u0644. \u064A\u0648\u0642\u0641 \u0645\u062D\u0627\u0648\u0644\u0629 \u0627\u0644\u062F\u062E\u0648\u0644 \u0648\u064A\u062D\u0630\u0651\u0631 \u0627\u0644\u0632\u0645\u0644\u0627\u0621. \u0623\u0648\u0642\u0641\u062A \u0627\u0644\u0647\u062C\u0648\u0645 \u0645\u0646 \u0627\u0644\u062E\u0637\u0648\u0629 \u0627\u0644\u0623\u0648\u0644\u0649."),lesson:r("Stop, verify through a channel you know, then report. It works for calls too.","\u062A\u0648\u0642\u0651\u0641\u060C \u0648\u062A\u062D\u0642\u0651\u0642 \u0639\u0628\u0631 \u0642\u0646\u0627\u0629 \u062A\u0639\u0631\u0641\u0647\u0627\u060C \u062B\u0645 \u0623\u0628\u0644\u0650\u063A. \u0648\u0647\u0630\u0627 \u064A\u0646\u0637\u0628\u0642 \u0639\u0644\u0649 \u0627\u0644\u0645\u0643\u0627\u0644\u0645\u0627\u062A \u0623\u064A\u0636\u064B\u0627.")}]},{id:"sms",title:r("The parcel fee text","\u0631\u0633\u0627\u0644\u0629 \u0631\u0633\u0648\u0645 \u0627\u0644\u0637\u0631\u062F"),channel:r("Text message","\u0631\u0633\u0627\u0644\u0629 \u0646\u0635\u064A\u0629"),beats:[{kind:"sms",who:r("Delta Post","\u062F\u0644\u062A\u0627 \u0628\u0648\u0633\u062A"),say:r("Your parcel is on hold. Pay a small fee within 12 hours to release it: https://delta-post-fee.invalid/r/8Hq2","\u0637\u0631\u062F\u0643 \u0645\u0639\u0644\u0651\u0642. \u0627\u062F\u0641\u0639 \u0631\u0633\u0648\u0645\u064B\u0627 \u0628\u0633\u064A\u0637\u0629 \u062E\u0644\u0627\u0644 12 \u0633\u0627\u0639\u0629 \u0644\u0644\u0625\u0641\u0631\u0627\u062C \u0639\u0646\u0647: https://delta-post-fee.invalid/r/8Hq2")}],question:r("You are not sure you're expecting a parcel. What do you do?","\u0644\u0633\u062A \u0645\u062A\u0623\u0643\u062F\u064B\u0627 \u0625\u0646 \u0643\u0646\u062A \u062A\u0646\u062A\u0638\u0631 \u0637\u0631\u062F\u064B\u0627. \u0645\u0627\u0630\u0627 \u062A\u0641\u0639\u0644\u061F"),options:[{text:r("Tap the link just to look","\u0623\u0646\u0642\u0631 \u0639\u0644\u0649 \u0627\u0644\u0631\u0627\u0628\u0637 \u0644\u0623\u0631\u0649 \u0641\u0642\u0637"),severity:"unsafe",points:0,outcome:r('The page asks for a card number to pay the "fee". Even if you stop there, the click can confirm your number is active and may load a harmful page.','\u0627\u0644\u0635\u0641\u062D\u0629 \u062A\u0637\u0644\u0628 \u0631\u0642\u0645 \u0628\u0637\u0627\u0642\u0629 \u0644\u062F\u0641\u0639 "\u0627\u0644\u0631\u0633\u0648\u0645". \u062D\u062A\u0649 \u0644\u0648 \u062A\u0648\u0642\u0641\u062A \u0647\u0646\u0627\u0643\u060C \u0642\u062F \u062A\u0624\u0643\u062F \u0627\u0644\u0646\u0642\u0631\u0629 \u0623\u0646 \u0631\u0642\u0645\u0643 \u0641\u0639\u0651\u0627\u0644 \u0648\u0642\u062F \u062A\u062D\u0645\u0651\u0644 \u0635\u0641\u062D\u0629 \u0636\u0627\u0631\u0629.'),lesson:r('Unexpected links are not safe to "just look at".','\u0627\u0644\u0631\u0648\u0627\u0628\u0637 \u063A\u064A\u0631 \u0627\u0644\u0645\u062A\u0648\u0642\u0639\u0629 \u0644\u064A\u0633\u062A \u0622\u0645\u0646\u0629 "\u0644\u0644\u0627\u0637\u0644\u0627\u0639 \u0641\u0642\u0637".')},{text:r("Reply STOP to the sender","\u0623\u0631\u062F \u0628\u0631\u0633\u0627\u0644\u0629 STOP"),severity:"partial",points:1,outcome:r("This doesn't verify anything, and replying can tell the sender that your number is in use. You avoided the link, though.","\u0647\u0630\u0627 \u0644\u0627 \u064A\u062A\u062D\u0642\u0642 \u0645\u0646 \u0634\u064A\u0621\u060C \u0648\u0642\u062F \u064A\u062E\u0628\u0631 \u0627\u0644\u0631\u062F \u0627\u0644\u0645\u0631\u0633\u0644 \u0623\u0646 \u0631\u0642\u0645\u0643 \u0645\u0633\u062A\u062E\u062F\u0645. \u0644\u0643\u0646\u0643 \u062A\u062C\u0646\u0628\u062A \u0627\u0644\u0631\u0627\u0628\u0637."),lesson:r("Don't engage with suspicious senders. Check independently instead.","\u0644\u0627 \u062A\u062A\u0641\u0627\u0639\u0644 \u0645\u0639 \u0645\u0631\u0633\u0644 \u0645\u0634\u0628\u0648\u0647. \u062A\u062D\u0642\u0642 \u0628\u0634\u0643\u0644 \u0645\u0633\u062A\u0642\u0644 \u0628\u062F\u0644\u064B\u0627 \u0645\u0646 \u0630\u0644\u0643.")},{text:r("Ignore the link, check the courier's official app or website, then report the text","\u0623\u062A\u062C\u0627\u0647\u0644 \u0627\u0644\u0631\u0627\u0628\u0637 \u0648\u0623\u062A\u062D\u0642\u0642 \u0645\u0646 \u062A\u0637\u0628\u064A\u0642 \u0634\u0631\u0643\u0629 \u0627\u0644\u0634\u062D\u0646 \u0623\u0648 \u0645\u0648\u0642\u0639\u0647\u0627 \u0627\u0644\u0631\u0633\u0645\u064A \u062B\u0645 \u0623\u0628\u0644\u0651\u063A \u0639\u0646 \u0627\u0644\u0631\u0633\u0627\u0644\u0629"),severity:"safe",points:2,outcome:r("The official app shows no held parcel. You delete the text and report it, which helps protect others.","\u0627\u0644\u062A\u0637\u0628\u064A\u0642 \u0627\u0644\u0631\u0633\u0645\u064A \u0644\u0627 \u064A\u064F\u0638\u0647\u0631 \u0623\u064A \u0637\u0631\u062F \u0645\u0639\u0644\u0651\u0642. \u062A\u062D\u0630\u0641 \u0627\u0644\u0631\u0633\u0627\u0644\u0629 \u0648\u062A\u0628\u0644\u0651\u063A \u0639\u0646\u0647\u0627\u060C \u0645\u0645\u0627 \u064A\u062D\u0645\u064A \u0627\u0644\u0622\u062E\u0631\u064A\u0646."),lesson:r("Use contact details you know are real, never the ones in the message.","\u0627\u0633\u062A\u062E\u062F\u0645 \u0648\u0633\u0627\u0626\u0644 \u0627\u062A\u0635\u0627\u0644 \u062A\u0639\u0631\u0641 \u0623\u0646\u0647\u0627 \u062D\u0642\u064A\u0642\u064A\u0629\u060C \u0648\u0644\u064A\u0633 \u062A\u0644\u0643 \u0627\u0644\u0648\u0627\u0631\u062F\u0629 \u0641\u064A \u0627\u0644\u0631\u0633\u0627\u0644\u0629.")}]},{id:"director",title:r('The urgent request from the "director"','\u0627\u0644\u0637\u0644\u0628 \u0627\u0644\u0639\u0627\u062C\u0644 \u0645\u0646 "\u0627\u0644\u0645\u062F\u064A\u0631"'),channel:r("Chat message","\u0631\u0633\u0627\u0644\u0629 \u0645\u062D\u0627\u062F\u062B\u0629"),realCase:!0,beats:[{kind:"chat",who:r("Director (new number)","\u0627\u0644\u0645\u062F\u064A\u0631 (\u0631\u0642\u0645 \u062C\u062F\u064A\u062F)"),say:r("I'm in a meeting and can't talk. I need you to pay a supplier invoice today. Details attached.","\u0623\u0646\u0627 \u0641\u064A \u0627\u062C\u062A\u0645\u0627\u0639 \u0648\u0644\u0627 \u0623\u0633\u062A\u0637\u064A\u0639 \u0627\u0644\u062D\u062F\u064A\u062B. \u0623\u062D\u062A\u0627\u062C \u0645\u0646\u0643 \u062F\u0641\u0639 \u0641\u0627\u062A\u0648\u0631\u0629 \u0645\u0648\u0631\u0651\u062F \u0627\u0644\u064A\u0648\u0645. \u0627\u0644\u062A\u0641\u0627\u0635\u064A\u0644 \u0645\u0631\u0641\u0642\u0629.")},{kind:"chat",who:r("Director (new number)","\u0627\u0644\u0645\u062F\u064A\u0631 (\u0631\u0642\u0645 \u062C\u062F\u064A\u062F)"),say:r("Keep this between us until I'm out. Let me know as soon as it's done.","\u0623\u0628\u0642\u0650 \u0627\u0644\u0623\u0645\u0631 \u0628\u064A\u0646\u0646\u0627 \u062D\u062A\u0649 \u0623\u0646\u062A\u0647\u064A. \u0623\u062E\u0628\u0631\u0646\u064A \u0641\u0648\u0631 \u0627\u0644\u0627\u0646\u062A\u0647\u0627\u0621.")}],question:r("You have payment authority. What do you do?","\u0644\u062F\u064A\u0643 \u0635\u0644\u0627\u062D\u064A\u0629 \u0627\u0644\u062F\u0641\u0639. \u0645\u0627\u0630\u0627 \u062A\u0641\u0639\u0644\u061F"),options:[{text:r("Pay it. You don't want to delay the director","\u0623\u062F\u0641\u0639. \u0644\u0627 \u0623\u0631\u064A\u062F \u062A\u0623\u062E\u064A\u0631 \u0627\u0644\u0645\u062F\u064A\u0631"),severity:"unsafe",points:0,outcome:r("The money goes to an account controlled by the attacker, and it is very hard to recover once sent.","\u062A\u0630\u0647\u0628 \u0627\u0644\u0623\u0645\u0648\u0627\u0644 \u0625\u0644\u0649 \u062D\u0633\u0627\u0628 \u064A\u0633\u064A\u0637\u0631 \u0639\u0644\u064A\u0647 \u0627\u0644\u0645\u0647\u0627\u062C\u0645\u060C \u0648\u0645\u0646 \u0627\u0644\u0635\u0639\u0628 \u062C\u062F\u064B\u0627 \u0627\u0633\u062A\u0631\u062F\u0627\u062F\u0647\u0627 \u0628\u0639\u062F \u0625\u0631\u0633\u0627\u0644\u0647\u0627."),lesson:r("Secrecy plus urgency is a classic pressure combination. Authority is exactly what attackers impersonate.","\u0627\u0644\u0633\u0631\u064A\u0629 \u0645\u0639 \u0627\u0644\u0627\u0633\u062A\u0639\u062C\u0627\u0644 \u062A\u0631\u0643\u064A\u0628\u0629 \u0636\u063A\u0637 \u0643\u0644\u0627\u0633\u064A\u0643\u064A\u0629. \u0648\u0627\u0644\u0633\u0644\u0637\u0629 \u0647\u064A \u0645\u0627 \u064A\u0646\u062A\u062D\u0644\u0647 \u0627\u0644\u0645\u0647\u0627\u062C\u0645\u0648\u0646 \u062A\u062D\u062F\u064A\u062F\u064B\u0627.")},{text:r("Reply in the chat asking for more details","\u0623\u0631\u062F \u0641\u064A \u0627\u0644\u0645\u062D\u0627\u062F\u062B\u0629 \u0648\u0623\u0637\u0644\u0628 \u0645\u0632\u064A\u062F\u064B\u0627 \u0645\u0646 \u0627\u0644\u062A\u0641\u0627\u0635\u064A\u0644"),severity:"partial",points:1,outcome:r("The attacker answers convincingly, because they control the conversation. You've gained nothing.","\u064A\u062C\u064A\u0628 \u0627\u0644\u0645\u0647\u0627\u062C\u0645 \u0628\u0625\u0642\u0646\u0627\u0639 \u0644\u0623\u0646\u0647 \u064A\u062A\u062D\u0643\u0645 \u0628\u0627\u0644\u0645\u062D\u0627\u062F\u062B\u0629. \u0644\u0645 \u062A\u0643\u0633\u0628 \u0634\u064A\u0626\u064B\u0627."),lesson:r("Questions asked inside the attacker's channel can't verify the attacker.","\u0627\u0644\u0623\u0633\u0626\u0644\u0629 \u062F\u0627\u062E\u0644 \u0642\u0646\u0627\u0629 \u0627\u0644\u0645\u0647\u0627\u062C\u0645 \u0644\u0627 \u062A\u062A\u062D\u0642\u0642 \u0645\u0646 \u0647\u0648\u064A\u0629 \u0627\u0644\u0645\u0647\u0627\u062C\u0645.")},{text:r("Verify using the director's known number, follow dual approval, and report the message","\u0623\u062A\u062D\u0642\u0642 \u0639\u0628\u0631 \u0631\u0642\u0645 \u0627\u0644\u0645\u062F\u064A\u0631 \u0627\u0644\u0645\u0639\u0631\u0648\u0641\u060C \u0648\u0623\u062A\u0628\u0639 \u0627\u0644\u0645\u0648\u0627\u0641\u0642\u0629 \u0627\u0644\u0645\u0632\u062F\u0648\u062C\u0629\u060C \u0648\u0623\u0628\u0644\u0651\u063A \u0639\u0646 \u0627\u0644\u0631\u0633\u0627\u0644\u0629"),severity:"safe",points:2,outcome:r("The real director knows nothing about it. The payment is never made and the number is blocked.","\u0627\u0644\u0645\u062F\u064A\u0631 \u0627\u0644\u062D\u0642\u064A\u0642\u064A \u0644\u0627 \u064A\u0639\u0644\u0645 \u0628\u0627\u0644\u0623\u0645\u0631. \u0644\u0627 \u062A\u064F\u0646\u0641\u064E\u0651\u0630 \u0627\u0644\u062F\u0641\u0639\u0629 \u0648\u064A\u064F\u062D\u0638\u0631 \u0627\u0644\u0631\u0642\u0645."),lesson:r("Verification through a known channel and a second approver beat any urgent story.","\u0627\u0644\u062A\u062D\u0642\u0642 \u0639\u0628\u0631 \u0642\u0646\u0627\u0629 \u0645\u0639\u0631\u0648\u0641\u0629 \u0648\u0645\u0648\u0627\u0641\u0642\u0629 \u0634\u062E\u0635 \u062B\u0627\u0646\u064D \u064A\u062A\u063A\u0644\u0628\u0627\u0646 \u0639\u0644\u0649 \u0623\u064A \u0642\u0635\u0629 \u0639\u0627\u062C\u0644\u0629.")}]}],ns={title:r("Real case: a $120 million invoice scam","\u0642\u0636\u064A\u0629 \u062D\u0642\u064A\u0642\u064A\u0629: \u0627\u062D\u062A\u064A\u0627\u0644 \u0641\u0648\u0627\u062A\u064A\u0631 \u0628\u0623\u0643\u062B\u0631 \u0645\u0646 120 \u0645\u0644\u064A\u0648\u0646 \u062F\u0648\u0644\u0627\u0631"),body:r("From 2013 to 2015, a fraudster set up a company with the same name as a real hardware supplier and sent phishing emails that appeared to come from it. Two U.S. technology companies wired more than $120 million to accounts he controlled. He was sentenced to 60 months in prison, per the U.S. Department of Justice (SDNY). The DOJ release does not name the victims; CyberScoop reported that a Lithuanian court order identified them as Facebook and Google.","\u0645\u0646 2013 \u0625\u0644\u0649 2015 \u0623\u0646\u0634\u0623 \u0645\u062D\u062A\u0627\u0644 \u0634\u0631\u0643\u0629 \u062A\u062D\u0645\u0644 \u0627\u0644\u0627\u0633\u0645 \u0646\u0641\u0633\u0647 \u0644\u0645\u0648\u0631\u0651\u062F \u062D\u0642\u064A\u0642\u064A \u0644\u0639\u062A\u0627\u062F \u0627\u0644\u062D\u0627\u0633\u0648\u0628 \u0648\u0623\u0631\u0633\u0644 \u0631\u0633\u0627\u0626\u0644 \u062A\u0635\u064A\u0651\u062F \u062A\u0628\u062F\u0648 \u0635\u0627\u062F\u0631\u0629 \u0639\u0646\u0647. \u062D\u0648\u0651\u0644\u062A \u0634\u0631\u0643\u062A\u0627\u0646 \u062A\u0642\u0646\u064A\u062A\u0627\u0646 \u0623\u0645\u0631\u064A\u0643\u064A\u062A\u0627\u0646 \u0623\u0643\u062B\u0631 \u0645\u0646 120 \u0645\u0644\u064A\u0648\u0646 \u062F\u0648\u0644\u0627\u0631 \u0625\u0644\u0649 \u062D\u0633\u0627\u0628\u0627\u062A \u064A\u0633\u064A\u0637\u0631 \u0639\u0644\u064A\u0647\u0627. \u062D\u064F\u0643\u0645 \u0639\u0644\u064A\u0647 \u0628\u0627\u0644\u0633\u062C\u0646 60 \u0634\u0647\u0631\u064B\u0627 \u0628\u062D\u0633\u0628 \u0648\u0632\u0627\u0631\u0629 \u0627\u0644\u0639\u062F\u0644 \u0627\u0644\u0623\u0645\u0631\u064A\u0643\u064A\u0629 (\u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u062C\u0646\u0648\u0628\u064A\u0629 \u0644\u0646\u064A\u0648\u064A\u0648\u0631\u0643). \u0628\u064A\u0627\u0646 \u0627\u0644\u0648\u0632\u0627\u0631\u0629 \u0644\u0627 \u064A\u0630\u0643\u0631 \u0623\u0633\u0645\u0627\u0621 \u0627\u0644\u0636\u062D\u0627\u064A\u0627\u061B \u0648\u0630\u0643\u0631\u062A CyberScoop \u0623\u0646 \u0623\u0645\u0631\u064B\u0627 \u0642\u0636\u0627\u0626\u064A\u064B\u0627 \u0644\u064A\u062A\u0648\u0627\u0646\u064A\u064B\u0627 \u062D\u062F\u0651\u062F\u0647\u0645\u0627 \u0628\u0623\u0646\u0647\u0645\u0627 \u0641\u064A\u0633\u0628\u0648\u0643 \u0648\u063A\u0648\u063A\u0644.")};var qt=[{id:"q1",q:r("According to CISA's phishing infographic, how quickly did 84% of employees take the bait after receiving a malicious email?","\u0648\u0641\u0642 \u0625\u0646\u0641\u0648\u063A\u0631\u0627\u0641\u064A\u0643 CISA \u0639\u0646 \u0627\u0644\u062A\u0635\u064A\u0651\u062F\u060C \u062E\u0644\u0627\u0644 \u0643\u0645 \u0645\u0646 \u0627\u0644\u0648\u0642\u062A \u0648\u0642\u0639 84% \u0645\u0646 \u0627\u0644\u0645\u0648\u0638\u0641\u064A\u0646 \u0641\u064A \u0627\u0644\u0641\u062E \u0628\u0639\u062F \u0648\u0635\u0648\u0644 \u0631\u0633\u0627\u0644\u0629 \u062E\u0628\u064A\u062B\u0629\u061F"),opts:[r("After about a week","\u0628\u0639\u062F \u0646\u062D\u0648 \u0623\u0633\u0628\u0648\u0639"),r("Within the first 10 minutes","\u062E\u0644\u0627\u0644 \u0623\u0648\u0644 10 \u062F\u0642\u0627\u0626\u0642"),r("Only after a follow-up reminder","\u0641\u0642\u0637 \u0628\u0639\u062F \u062A\u0630\u0643\u064A\u0631 \u0644\u0627\u062D\u0642"),r("Never within the first day","\u0644\u0627 \u064A\u062D\u062F\u062B \u062E\u0644\u0627\u0644 \u0627\u0644\u064A\u0648\u0645 \u0627\u0644\u0623\u0648\u0644")],correct:1,why:r("CISA reports that, within the first 10 minutes of receiving a malicious email, 84% of employees took the bait by replying with sensitive information or interacting with a spoofed link or attachment. Speed matters.","\u062A\u0630\u0643\u0631 CISA \u0623\u0646\u0647 \u062E\u0644\u0627\u0644 \u0623\u0648\u0644 10 \u062F\u0642\u0627\u0626\u0642 \u0645\u0646 \u0648\u0635\u0648\u0644 \u0631\u0633\u0627\u0644\u0629 \u062E\u0628\u064A\u062B\u0629 \u0648\u0642\u0639 84% \u0645\u0646 \u0627\u0644\u0645\u0648\u0638\u0641\u064A\u0646 \u0641\u064A \u0627\u0644\u0641\u062E\u060C \u0628\u0627\u0644\u0631\u062F \u0628\u0645\u0639\u0644\u0648\u0645\u0627\u062A \u062D\u0633\u0651\u0627\u0633\u0629 \u0623\u0648 \u0628\u0627\u0644\u062A\u0641\u0627\u0639\u0644 \u0645\u0639 \u0631\u0627\u0628\u0637 \u0623\u0648 \u0645\u0631\u0641\u0642 \u0645\u0632\u064A\u0651\u0641. \u0627\u0644\u0633\u0631\u0639\u0629 \u0645\u0647\u0645\u0629.")},{id:"q2",q:r("What share of targeted employees reported the phishing attempt in CISA's assessments?","\u0645\u0627 \u0646\u0633\u0628\u0629 \u0627\u0644\u0645\u0648\u0638\u0641\u064A\u0646 \u0627\u0644\u0645\u0633\u062A\u0647\u062F\u0641\u0
